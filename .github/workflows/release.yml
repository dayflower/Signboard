name: Release

# When a version bump PR is merged into main (see scripts/bump-version-pr.sh),
# VERSION changes. This workflow reads that version, and if a matching tag does
# not yet exist, it builds the app, signs it with a Developer ID certificate,
# notarizes and staples it, and publishes a GitHub Release. On ordinary pushes
# (version unchanged) it exits early.
#
# The tag is created by `gh release create --target` at the very end rather than
# pushed by hand up front, so a failure part-way through leaves no tag behind and
# the run can simply be retried.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail

          ./scripts/version.sh assert-consistent
          VERSION="$(./scripts/version.sh current)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          # Ask the remote rather than the local checkout so no deep fetch of
          # tags is needed.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; nothing to release."
            echo "release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Releasing v${VERSION}."
            echo "release=true" >> "${GITHUB_OUTPUT}"
          fi

  release:
    name: Release
    needs: check
    if: ${{ needs.check.outputs.release == 'true' }}
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_VERSION: ${{ needs.check.outputs.version }}
      TAG_NAME: v${{ needs.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify signing secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          missing=()
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required signing secrets: ${missing[*]}" >&2
            echo "Releases must be signed with a Developer ID identity and notarized; see docs/DEVELOPMENT.md." >&2
            exit 1
          fi

      # The action creates a throwaway keychain and removes it again in its post
      # step, so nothing has to be cleaned up by hand.
      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      # Pass the identity to package-app.sh by its SHA-1 hash so the
      # certificate's common name never has to be hardcoded. The action put its
      # keychain on the search list, so search that rather than guessing where
      # the file lives; the runner's own login keychain holds no identities.
      - name: Resolve signing identity
        run: |
          set -euo pipefail

          identity="$(security find-identity -v -p codesigning \
            | awk '/Developer ID Application/ { print $2; exit }')"

          if [[ -z "${identity}" ]]; then
            echo "No Developer ID Application identity on the keychain search list" >&2
            security list-keychains >&2
            security find-identity -v -p codesigning >&2
            exit 1
          fi

          echo "CODESIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"

      - name: Build release artifact
        run: |
          set -euo pipefail

          APP_VERSION="${SOURCE_VERSION}" APP_BUILD_VERSION="${GITHUB_RUN_NUMBER}" ./scripts/package-app.sh

      # Stapling writes the ticket into the bundle, so this has to happen before
      # the distributed zip is created.
      - name: Notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          NOTARY_KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
          export NOTARY_KEY_PATH
          printf '%s' "${NOTARY_KEY_BASE64}" | base64 --decode > "${NOTARY_KEY_PATH}"
          ./scripts/notarize-app.sh

      - name: Remove notarization key
        if: always()
        run: rm -f "${RUNNER_TEMP}/notary-key.p8"

      - name: Package release artifact
        id: package
        run: |
          set -euo pipefail

          ZIP_PATH="dist/SignboardApp-${SOURCE_VERSION}.zip"
          rm -f "${ZIP_PATH}"
          ditto -c -k --sequesterRsrc --keepParent "dist/SignboardApp.app" "${ZIP_PATH}"
          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Generate checksum
        id: checksum
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          set -euo pipefail

          CHECKSUM_PATH="${ZIP_PATH}.sha256"
          shasum -a 256 "${ZIP_PATH}" > "${CHECKSUM_PATH}"
          CHECKSUM_VALUE="$(awk '{ print $1 }' "${CHECKSUM_PATH}")"

          echo "checksum_path=${CHECKSUM_PATH}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Release Artifact"
            echo ""
            echo "- Tag: \`${TAG_NAME}\`"
            echo "- Version: \`${SOURCE_VERSION}\`"
            echo "- Archive: \`${ZIP_PATH}\`"
            echo "- SHA-256: \`${CHECKSUM_VALUE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Ensure release does not exist
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. This workflow only creates new releases." >&2
            exit 1
          fi

      # --target tags the commit being released, so no separate tagging step is
      # needed and nothing is tagged unless the build got this far.
      - name: Create release and upload assets
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.checksum.outputs.checksum_path }}
        run: |
          set -euo pipefail

          gh release create "${TAG_NAME}" \
            "${ZIP_PATH}" \
            "${CHECKSUM_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG_NAME}" \
            --notes "Automated release for ${TAG_NAME}"

      # The cask is rendered from .github/homebrew/signboard.rb.mustache in this
      # repository, so distribution metadata is reviewed alongside app changes.
      - name: Update Homebrew tap
        uses: dayflower/brew-up@d54916a2db1d7182a4681a6e72adc01022f37794 # v1.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          release-tag: v${{ needs.check.outputs.version }}
          template-path: .github/homebrew/signboard.rb.mustache
          output-path: Casks/signboard.rb
          asset-map: |
            default=SignboardApp-{{version}}.zip
          target-repo: dayflower/homebrew-tap
          target-branch: main
          target-repo-token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          publish-mode: pr-auto-merge
          auto-merge-method: squash
